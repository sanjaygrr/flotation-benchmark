[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flotation-benchmark"
version = "0.1.0"
description = "Leakage-aware benchmark for soft sensors on the public iron-ore flotation dataset"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjay Ramchandani" }]
requires-python = ">=3.10"
keywords = ["soft sensor", "flotation", "mineral processing", "benchmark", "data leakage", "time series"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
flotation-benchmark = "flotation_benchmark.cli:main"

[project.urls]
Repository = "https://github.com/sanjaygrr/flotation-benchmark"

[tool.hatch.build.targets.wheel]
packages = ["src/flotation_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]
